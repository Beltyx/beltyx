<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="BELTYX leather product detail."><link rel="manifest" href="manifest.webmanifest"><title>BELTYX — Product</title><link rel="stylesheet" href="style.css?v=30260927abc"><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="cloud.js"></script><script src="whatsapp.js"></script><script src="storefront.js?v=20261019-cny-jpy-zoomfix"></script><link rel="stylesheet" href="motion.css?v=3"><script src="motion.js?v=3" defer></script></head><body><header class="site-header"><a class="brand" href="index.html"><img src="assets/beltyx-logo.svg" alt="BELTYX"><span><strong>BELTYX</strong><small>LEATHER GOODS</small></span></a><nav class="site-nav" id="siteNav"><a href="index.html">Home</a><a href="shop.html">Shop</a><a href="collections.html">Collections</a><a href="customize.html">Customize</a><a href="about.html">Our Story</a><a href="reviews.html">Reviews</a><a href="contact.html">Contact</a></nav><div class="header-actions"><a class="icon-button bag-button" href="cart.html">Bag <span data-cart-count>0</span></a><button class="icon-button menu-toggle" id="menuToggle">☰</button></div></header><main><section class="section" id="productRoot"><div class="empty">Loading piece…</div></section></main><footer class="footer"><div class="footer-grid"><div><div class="footer-brand">BELTYX</div><p>Leather, Made to Last.</p></div><div><h4>Explore</h4><a href="shop.html">Shop</a><a href="collections.html">Collections</a></div><div><h4>Help</h4><a href="about.html">Our Story</a><a href="contact.html">Contact</a></div><div><h4>Store</h4><a data-whatsapp href="https://wa.me/923174960570">WhatsApp</a></div></div><div class="footer-bottom"><span>© <span data-year></span> BELTYX</span></div></footer><script>document.addEventListener('beltyx-ready',()=>{const id=Number(new URLSearchParams(location.search).get('id'));const p=ABC.PRODUCTS().find(x=>Number(x.id)===id);if(!p){document.getElementById('productRoot').innerHTML='<div class="empty">This piece could not be found. <a href="shop.html">Return to shop →</a></div>';return}document.title=p.name+' — BELTYX';const ms=ABC.media(p); if(!ms.length){ms.push({type:'image',url:p.image||'assets/messenger-bag.png'})}document.getElementById('productRoot').innerHTML=`<div class="product-detail"><div class="gallery"><div class="thumbs">${ms.map((m,i)=>`<button class="thumb ${i===0?'active':''}" data-i="${i}">${m.type==='video'?`<video muted src="${ABC.esc(m.url)}"></video>`:`<img src="${ABC.esc(m.url)}" alt="">`}</button>`).join('')}</div><div class="gallery-main magnify-main" id="mainMedia"><img src="${ABC.esc(ms[0].url)}" alt="${ABC.esc(p.name)}"></div></div><div class="detail-copy"><p class="eyebrow">${ABC.esc(p.category)}</p><h1>${ABC.esc(p.name)}</h1><strong class="price" data-detail-price>${ABC.priceHTML(p)}</strong><p>${ABC.esc(p.desc||'A considered leather piece made for everyday use.')}</p><div class="detail-list"><div><span>Material</span><b>Leather</b></div><div><span>Style</span><b>${ABC.esc(p.badge||'ABC')}</b></div><div><span>Enquiries</span><b>Worldwide</b></div></div><div class="hero-actions"><button class="btn btn-light" onclick="ABC.addCart(${p.id})">Add to bag</button><button class="btn btn-outline wishlist-btn" id="wishBtn" type="button" onclick="ABC.toggleWishlist(${p.id});updateWishButton()">♡ Wishlist</button><a class="btn btn-outline" style="background:#171410;color:#fff" data-whatsapp href="https://wa.me/923174960570">WhatsApp enquiry</a></div></div></div>`;document.querySelectorAll('.thumb').forEach(b=>b.onclick=()=>{document.querySelectorAll('.thumb').forEach(x=>x.classList.remove('active'));b.classList.add('active');const m=ms[Number(b.dataset.i)];document.getElementById('mainMedia').innerHTML=m.type==='video'?`<video controls playsinline src="${ABC.esc(m.url)}"></video>`:`<img src="${ABC.esc(m.url)}" alt="${ABC.esc(p.name)}">`});
const main=document.getElementById('mainMedia');
function updateWishButton(){const b=document.getElementById('wishBtn');if(b)b.textContent=BELTYX.isWished(p.id)?'♥ In wishlist':'♡ Wishlist'}
updateWishButton();
main.addEventListener('mousemove',e=>{const r=main.getBoundingClientRect();main.style.setProperty('--mx',((e.clientX-r.left)/r.width*100)+'%');main.style.setProperty('--my',((e.clientY-r.top)/r.height*100)+'%')});
main.addEventListener('mouseleave',()=>{main.style.removeProperty('--mx');main.style.removeProperty('--my')});
});
</script></body></html>
